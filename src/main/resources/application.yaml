spring:
  application:
    name: shipsensor

  datasource:
    url: jdbc:mysql://10.20.102.202:3306/ship_sensor?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: tongyan
    password: 2005
    driver-class-name: com.mysql.cj.jdbc.Driver

    druid:
      initial-size: 20
      min-idle: 20
      max-active: 200
      max-wait: 60000
      filters: stat,wall

      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin


  redis:
    host: 172.19.134.209
    port: 6379
    password:
    database: 0
    timeout: 5000ms

    lettuce:
      pool:
        max-active: 20
        max-idle: 10


  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false



server:
  port: 1910
  servlet:
    context-path: /api



mybatis-plus:

  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: shipsensor.entity

  global-config:
    db-config:
      id-type: auto

  configuration:
    map-underscore-to-camel-case: true
    default-executor-type: batch


simulator:
  enabled: false

  sensor-config:
    enabled: false


  sensor-data:
    enabled: false

    interval: 1000

    batch-size: 50000

    initializer:
      route-enabled: false
      runtime-status-enabled: false
      alert-enabled: false

  # 低频实时数据生成（独立于 simulator.enabled 总开关，不会启用高频模拟器）
  # 每 interval-seconds 秒随机抽取 per-tick 个传感器各生成 1 条数据
  # 默认 10 秒 x 10 条 ≈ 8.6 万条/天，长期部署可接受；需要更慢请调大周期或调小抽样数
  realtime:
    enabled: true
    interval-seconds: 10
    per-tick: 10

# JWT Configuration
jwt:
  secret-key: shipsensor-secret-key-2024-nautix-maritime-platform-jwt-signature
  expiration: 86400000  # 24 hours in milliseconds